<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vocab Quiz — Greek Practice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #FAF7F2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 1rem;
      color: #2C2420;
    }

    .app {
      max-width: 560px;
      width: 100%;
      padding-top: 0.5rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      color: #bbb;
      text-decoration: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .back-link:hover { color: #888; }

    h1 {
      font-size: 28px;
      font-weight: normal;
      text-align: center;
      margin-bottom: 0.25rem;
      color: #2C2420;
    }

    .tagline {
      text-align: center;
      font-size: 14px;
      color: #998A7A;
      margin-bottom: 1.5rem;
    }

    .loading {
      text-align: center;
      padding: 3rem 1rem;
      color: #998A7A;
      font-size: 16px;
    }
    .loading .spinner {
      display: inline-block;
      width: 24px; height: 24px;
      border: 3px solid #E8E0D6;
      border-top-color: #8B7355;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filter-toggle {
      width: 100%;
      background: #F3EDE5;
      border: 1px solid #E8E0D6;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #5C4E3E;
      cursor: pointer;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .filter-toggle:hover { background: #EDE5DA; }
    .filter-toggle .arrow { transition: transform 0.2s; }
    .filter-toggle.open .arrow { transform: rotate(90deg); }

    .filters {
      background: #F3EDE5;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      display: none;
      flex-wrap: wrap;
      gap: 0.4rem 1rem;
      align-items: center;
    }
    .filters.open { display: flex; }
    .filters-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #998A7A;
      width: 100%;
      margin-bottom: 0.2rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .filters label {
      font-size: 13px;
      color: #5C4E3E;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .filters input[type="checkbox"] { accent-color: #8B7355; }

    .mode-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .mode-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1.5px solid #D6CBBC;
      border-radius: 8px;
      background: #fff;
      color: #5C4E3E;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }
    .mode-btn.active {
      background: #5C4E3E;
      color: #FAF7F2;
      border-color: #5C4E3E;
    }
    .mode-btn:hover:not(.active) {
      border-color: #8B7355;
      background: #F3EDE5;
    }

    .write-options {
      margin-bottom: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #5C4E3E;
      display: none;
    }
    .write-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .write-options input[type="checkbox"] { accent-color: #8B7355; }

    .stats {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #998A7A;
    }
    .stats span { display: flex; align-items: center; gap: 4px; }
    .stat-val { font-weight: 700; color: #5C4E3E; }
    .stat-correct .stat-val { color: #4A7C59; }
    .stat-wrong .stat-val { color: #A05252; }

    .card {
      background: #fff;
      border: 1px solid #E8E0D6;
      border-radius: 14px;
      padding: 2rem 1.5rem;
      margin-bottom: 1.25rem;
      text-align: center;
    }
    .lexical {
      font-size: 26px;
      margin-bottom: 0.35rem;
      color: #2C2420;
    }
    .meaning-prompt {
      font-size: 20px;
      color: #2C2420;
      margin-bottom: 0.35rem;
      line-height: 1.4;
    }
    .pos-hint {
      font-size: 12px;
      color: #C8BBAA;
      margin-bottom: 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-transform: lowercase;
    }
    .prompt-label {
      font-size: 14px;
      color: #998A7A;
      margin-bottom: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 420px;
      margin: 0 auto;
    }
    .choice-btn {
      padding: 0.65rem 1rem;
      border: 1.5px solid #D6CBBC;
      border-radius: 8px;
      background: #FDFBF8;
      color: #2C2420;
      font-size: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      line-height: 1.35;
    }
    .choice-btn:hover:not(:disabled) {
      border-color: #8B7355;
      background: #F3EDE5;
    }
    .choice-btn.greek {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
      text-align: center;
    }
    .choice-btn.correct {
      background: #E8F2EB;
      border-color: #4A7C59;
      color: #2D5A3A;
    }
    .choice-btn.wrong {
      background: #F5EAEA;
      border-color: #A05252;
      color: #7A3A3A;
    }
    .choice-btn.reveal {
      background: #F3EDE5;
      border-color: #8B7355;
      color: #5C4E3E;
    }
    .choice-btn:disabled { cursor: default; }

    .input-row {
      display: flex;
      gap: 0.5rem;
      max-width: 360px;
      margin: 0 auto 0.75rem;
    }
    #answer-input {
      flex: 1;
      font-size: 22px;
      font-family: Georgia, "Times New Roman", serif;
      padding: 0.6rem 0.75rem;
      border: 1.5px solid #D6CBBC;
      border-radius: 8px;
      background: #FDFBF8;
      color: #2C2420;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
    }
    #answer-input:focus { border-color: #8B7355; }
    #answer-input::placeholder {
      color: #C8BBAA;
      font-size: 16px;
    }

    .btn {
      padding: 0.6rem 1.25rem;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-check {
      background: #5C4E3E;
      color: #FAF7F2;
    }
    .btn-check:hover { background: #4A3E30; }
    .btn-skip {
      background: transparent;
      color: #998A7A;
      border: 1.5px solid #D6CBBC;
    }
    .btn-skip:hover { background: #F3EDE5; }
    .btn-next {
      background: #8B7355;
      color: #FAF7F2;
    }
    .btn-next:hover { background: #74603F; }

    .btn-row {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 0.75rem;
    }

    .feedback {
      font-size: 16px;
      min-height: 1.5em;
      margin-top: 0.75rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .feedback.correct { color: #4A7C59; }
    .feedback.incorrect { color: #A05252; }

    .answer-detail {
      font-size: 15px;
      color: #5C4E3E;
      margin-top: 0.4rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .notes-gloss {
      font-size: 13px;
      color: #998A7A;
      font-style: italic;
      margin-top: 0.35rem;
      line-height: 1.4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .empty-msg {
      font-size: 16px;
      color: #998A7A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 1rem 0;
    }

    @media (max-width: 480px) {
      .lexical { font-size: 22px; }
      .meaning-prompt { font-size: 18px; }
      #answer-input { font-size: 20px; }
      .card { padding: 1.5rem 1rem; }
      .filters { gap: 0.3rem 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <a class="back-link" href="index.html">&#8249; All games</a>
    <h1>Vocab Quiz</h1>
    <p class="tagline">Recognize vocabulary across the whole list</p>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <div>Loading vocabulary...</div>
    </div>

    <div id="game" style="display:none;">
      <button class="filter-toggle open" id="filter-toggle">
        <span>Filters</span>
        <span class="arrow">&#8250;</span>
      </button>
      <div class="filters open" id="filters">
        <div class="filters-title">Part of speech</div>
        <div id="filter-checkboxes"></div>
      </div>

      <div class="mode-row">
        <button class="mode-btn active" data-mode="read">Read (Greek &#8594; English)</button>
        <button class="mode-btn" data-mode="write">Write (English &#8594; Greek)</button>
      </div>

      <div class="write-options" id="write-options">
        <label><input type="checkbox" id="type-answer"> Type the answer (harder)</label>
      </div>

      <div class="stats">
        <span class="stat-correct">&#10003; <span class="stat-val" id="stat-correct">0</span></span>
        <span class="stat-wrong">&#10007; <span class="stat-val" id="stat-wrong">0</span></span>
        <span>Acc <span class="stat-val" id="stat-acc">0%</span></span>
        <span>Streak <span class="stat-val" id="stat-streak">0</span></span>
      </div>

      <div class="card">
        <div class="lexical" id="lexical" style="display:none;"></div>
        <div class="meaning-prompt" id="meaning-prompt" style="display:none;"></div>
        <div class="pos-hint" id="pos-hint"></div>
        <div class="prompt-label" id="prompt-label"></div>

        <div class="choices" id="choices"></div>

        <div class="input-row" id="input-row" style="display:none;">
          <input type="text" id="answer-input" placeholder="type Greek..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          <button class="btn btn-check" id="btn-check">Check</button>
        </div>

        <div class="btn-row" id="btn-row-pre">
          <button class="btn btn-skip" id="btn-skip">Skip</button>
        </div>

        <div class="feedback" id="feedback"></div>
        <div class="answer-detail" id="answer-detail"></div>
        <div class="notes-gloss" id="notes-gloss"></div>

        <div class="btn-row" id="btn-row-post" style="display:none;">
          <button class="btn btn-next" id="btn-next">Next</button>
        </div>
      </div>
    </div>
  </div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSbCVK8ZbE0a3YPeVZB0i5E6Xgh0Nm_mjxUEdRqE3WFgcuFOpJYBj50bIj181wcgFvfGfL3tLsElZcI/pub?output=csv';
const LS_KEY = 'vocab-quiz-weights';
const MIN_WEIGHT = 0.25;

let allWords = [];
let weights = {};
let mode = 'read';
let typeAnswer = false;
let stats = { correct: 0, wrong: 0, streak: 0 };
let current = null;
let answered = false;
let lastLexical = null;
let currentChoices = [];

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ',') {
      row.push(field);
      field = '';
    } else if (c === '\n' || (c === '\r' && text[i + 1] === '\n')) {
      row.push(field);
      field = '';
      if (row.some(cell => cell.length > 0)) rows.push(row);
      row = [];
      if (c === '\r') i++;
    } else if (c !== '\r') {
      field += c;
    }
  }

  if (field.length > 0 || row.length > 0) {
    row.push(field);
    if (row.some(cell => cell.length > 0)) rows.push(row);
  }

  if (rows.length === 0) return [];

  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(cols => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (cols[i] || '').trim(); });
    return obj;
  });
}

function normalizeGreek(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
}

function stripArticle(lexical) {
  return lexical.replace(/^(ὁ|ἡ|τό)\s+/, '');
}

function loadWeights() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* degrade silently */ }
  return {};
}

function saveWeight(lexical, weight) {
  weights[lexical] = weight;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(weights));
  } catch (e) { /* degrade silently */ }
}

function getWeight(word) {
  return weights[word.lexical] != null ? weights[word.lexical] : 1;
}

function recordCorrect(word) {
  const w = Math.max(MIN_WEIGHT, getWeight(word) * 0.5);
  saveWeight(word.lexical, w);
}

function recordWrong(word) {
  saveWeight(word.lexical, 3);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getFilteredDeck() {
  const checked = new Set();
  document.querySelectorAll('#filter-checkboxes input:checked').forEach(cb => {
    checked.add(cb.dataset.pos);
  });
  return allWords.filter(w => checked.has(w.pos || ''));
}

function pickWeighted(deck) {
  let pool = deck;
  if (lastLexical && deck.length > 1) {
    pool = deck.filter(w => w.lexical !== lastLexical);
  }
  const total = pool.reduce((sum, w) => sum + getWeight(w), 0);
  let r = Math.random() * total;
  for (const w of pool) {
    r -= getWeight(w);
    if (r <= 0) return w;
  }
  return pool[pool.length - 1];
}

function pickDistractors(target, deck, count, getValue) {
  const correctVal = getValue(target);
  const samePos = deck.filter(w => w.lexical !== target.lexical && w.pos === target.pos && getValue(w) !== correctVal);
  const others = deck.filter(w => w.lexical !== target.lexical && w.pos !== target.pos && getValue(w) !== correctVal);
  const pool = shuffle(samePos.concat(others));
  const chosen = [];
  const seen = new Set([correctVal]);

  for (const w of pool) {
    const val = getValue(w);
    if (seen.has(val)) continue;
    seen.add(val);
    chosen.push(w);
    if (chosen.length >= count) break;
  }
  return chosen;
}

function buildReadChoices(word, deck) {
  const distractors = pickDistractors(word, deck, 3, w => w.meaning);
  const options = shuffle([{ text: word.meaning, correct: true }].concat(
    distractors.map(w => ({ text: w.meaning, correct: false }))
  ));
  return options;
}

function buildWriteChoices(word, deck) {
  const distractors = pickDistractors(word, deck, 3, w => w.lexical);
  const options = shuffle([{ text: word.lexical, correct: true }].concat(
    distractors.map(w => ({ text: w.lexical, correct: false }))
  ));
  return options;
}

function checkGreekAnswer(input, lexical) {
  const nInput = normalizeGreek(stripArticle(input));
  const nLex = normalizeGreek(stripArticle(lexical));
  return nInput === nLex;
}

function updateStats() {
  document.getElementById('stat-correct').textContent = stats.correct;
  document.getElementById('stat-wrong').textContent = stats.wrong;
  const total = stats.correct + stats.wrong;
  document.getElementById('stat-acc').textContent = total ? Math.round(100 * stats.correct / total) + '%' : '0%';
  document.getElementById('stat-streak').textContent = stats.streak;
}

function clearFeedback() {
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('answer-detail').textContent = '';
  document.getElementById('notes-gloss').textContent = '';
}

function showPostAnswer(correct) {
  document.getElementById('btn-row-pre').style.display = 'none';
  document.getElementById('btn-row-post').style.display = 'flex';
}

function renderChoices(options, greekStyle) {
  const container = document.getElementById('choices');
  container.innerHTML = '';
  currentChoices = options;

  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn' + (greekStyle ? ' greek' : '');
    btn.textContent = opt.text;
    btn.dataset.index = i;
    btn.addEventListener('click', () => selectChoice(i));
    container.appendChild(btn);
  });
}

function setUIForMode() {
  const writeOpts = document.getElementById('write-options');
  writeOpts.style.display = mode === 'write' ? 'block' : 'none';
}

function nextQuestion() {
  const deck = getFilteredDeck();
  clearFeedback();

  document.getElementById('btn-row-pre').style.display = 'flex';
  document.getElementById('btn-row-post').style.display = 'none';

  const lexicalEl = document.getElementById('lexical');
  const meaningEl = document.getElementById('meaning-prompt');
  const posHint = document.getElementById('pos-hint');
  const promptLabel = document.getElementById('prompt-label');
  const choicesEl = document.getElementById('choices');
  const inputRow = document.getElementById('input-row');

  if (deck.length === 0) {
    answered = true;
    current = null;
    lexicalEl.style.display = 'none';
    meaningEl.style.display = 'none';
    posHint.textContent = '';
    promptLabel.textContent = '';
    choicesEl.innerHTML = '<p class="empty-msg">No words match your filters</p>';
    inputRow.style.display = 'none';
    document.getElementById('btn-row-pre').style.display = 'none';
    return;
  }

  answered = false;
  const word = pickWeighted(deck);
  lastLexical = word.lexical;
  current = word;

  const useTyping = mode === 'write' && typeAnswer;

  if (mode === 'read') {
    lexicalEl.style.display = 'block';
    meaningEl.style.display = 'none';
    lexicalEl.textContent = word.lexical;
    posHint.textContent = word.pos || '';
    promptLabel.textContent = 'What does this word mean?';
    inputRow.style.display = 'none';
    renderChoices(buildReadChoices(word, deck), false);
  } else {
    lexicalEl.style.display = 'none';
    meaningEl.style.display = 'block';
    meaningEl.textContent = word.meaning;
    posHint.textContent = '';
    if (useTyping) {
      promptLabel.textContent = 'Type the Greek word:';
      choicesEl.innerHTML = '';
      inputRow.style.display = 'flex';
      const input = document.getElementById('answer-input');
      input.disabled = false;
      input.value = '';
      input.focus();
    } else {
      promptLabel.textContent = 'Which Greek word means this?';
      inputRow.style.display = 'none';
      renderChoices(buildWriteChoices(word, deck), true);
    }
  }
}

function showAnswerFeedback(isCorrect, skipped) {
  const fb = document.getElementById('feedback');
  const detail = document.getElementById('answer-detail');
  const notes = document.getElementById('notes-gloss');

  if (skipped) {
    fb.textContent = 'Skipped';
    fb.className = 'feedback incorrect';
  } else if (isCorrect) {
    fb.textContent = 'Correct!';
    fb.className = 'feedback correct';
  } else {
    fb.textContent = 'Incorrect';
    fb.className = 'feedback incorrect';
  }

  if (mode === 'read') {
    detail.textContent = current.meaning;
  } else {
    detail.textContent = current.lexical;
  }

  if (current.notes) {
    notes.textContent = current.notes;
  } else {
    notes.textContent = '';
  }
}

function selectChoice(index) {
  if (!current || answered) return;
  answered = true;

  const opt = currentChoices[index];
  const isCorrect = opt.correct;

  if (isCorrect) {
    stats.correct++;
    stats.streak++;
    recordCorrect(current);
  } else {
    stats.wrong++;
    stats.streak = 0;
    recordWrong(current);
  }

  updateStats();

  document.querySelectorAll('#choices .choice-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (currentChoices[i].correct) {
      btn.classList.add('correct');
    } else if (i === index) {
      btn.classList.add('wrong');
    }
  });

  showAnswerFeedback(isCorrect, false);
  showPostAnswer(isCorrect);
}

function submitTypedAnswer() {
  if (!current || answered) return;
  const input = document.getElementById('answer-input').value.trim();
  if (!input) return;

  answered = true;
  const isCorrect = checkGreekAnswer(input, current.lexical);

  if (isCorrect) {
    stats.correct++;
    stats.streak++;
    recordCorrect(current);
  } else {
    stats.wrong++;
    stats.streak = 0;
    recordWrong(current);
  }

  updateStats();
  document.getElementById('answer-input').disabled = true;
  showAnswerFeedback(isCorrect, false);
  showPostAnswer(isCorrect);
}

function skipQuestion() {
  if (!current || answered) return;
  answered = true;
  stats.wrong++;
  stats.streak = 0;
  recordWrong(current);
  updateStats();

  if (mode === 'write' && typeAnswer) {
    document.getElementById('answer-input').disabled = true;
  } else {
    document.querySelectorAll('#choices .choice-btn').forEach((btn, i) => {
      btn.disabled = true;
      if (currentChoices[i] && currentChoices[i].correct) {
        btn.classList.add('reveal');
      }
    });
  }

  showAnswerFeedback(false, true);
  showPostAnswer(false);
}

function buildFilters() {
  const posValues = [...new Set(allWords.map(w => w.pos || ''))].sort((a, b) => {
    if (!a) return 1;
    if (!b) return -1;
    return a.localeCompare(b);
  });

  const container = document.getElementById('filter-checkboxes');
  container.innerHTML = '';

  posValues.forEach(pos => {
    const label = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = true;
    cb.dataset.pos = pos;
    cb.addEventListener('change', () => {
      if (!answered) nextQuestion();
    });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(pos || '(none)'));
    container.appendChild(label);
  });
}

document.getElementById('btn-check').addEventListener('click', submitTypedAnswer);
document.getElementById('btn-skip').addEventListener('click', skipQuestion);
document.getElementById('btn-next').addEventListener('click', nextQuestion);

document.getElementById('answer-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (answered) nextQuestion();
    else submitTypedAnswer();
  }
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && answered && e.target !== document.getElementById('answer-input')) {
    nextQuestion();
  }
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    mode = this.dataset.mode;
    setUIForMode();
    nextQuestion();
  });
});

document.getElementById('type-answer').addEventListener('change', function() {
  typeAnswer = this.checked;
  if (mode === 'write') nextQuestion();
});

document.getElementById('filter-toggle').addEventListener('click', function() {
  this.classList.toggle('open');
  document.getElementById('filters').classList.toggle('open');
});

async function init() {
  try {
    const response = await fetch(SHEET_URL);
    const csv = await response.text();
    const vocab = parseCSV(csv);

    allWords = vocab.filter(entry => entry.lexical && entry.meaning);
    weights = loadWeights();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('game').style.display = 'block';

    if (allWords.length === 0) {
      document.getElementById('choices').innerHTML =
        '<p class="empty-msg">No vocabulary found in sheet</p>';
      return;
    }

    buildFilters();
    setUIForMode();
    nextQuestion();
  } catch (err) {
    document.getElementById('loading').innerHTML =
      '<div style="color:#A05252;">Failed to load vocabulary.<br><small>' + err.message + '</small></div>';
  }
}

init();
</script>
</body>
</html>
